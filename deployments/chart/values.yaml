## @section Common Parameters

## @param nameOverride Override the chart name used in resource names
nameOverride: ""
## @param fullnameOverride Override the full resource name
fullnameOverride: ""
## @param commonLabels Labels added to every resource the chart creates
commonLabels: {}

## @section Downscaler Controller

## @param replicaCount Number of controller replicas. Leader election is turned on when this is greater than 1
replicaCount: 1
## @param revisionHistoryLimit Number of old ReplicaSets kept for rollback
revisionHistoryLimit: 3
## The old pod stops before the new one starts, so two scan loops never overlap
## without leader election; with it, replicas roll one at a time.
## @param updateStrategy.type Deployment update strategy
## @param updateStrategy.rollingUpdate.maxSurge Extra pods during a rollout
## @param updateStrategy.rollingUpdate.maxUnavailable Pods that may be down during a rollout
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1

## @param image.repository Controller image repository
## @param image.tag Controller image tag. Defaults to the chart appVersion
## @param image.digest Controller image digest (sha256:...). Takes precedence over the tag when set
## @param image.pullPolicy Controller image pull policy
image:
  repository: ghcr.io/caas-team/gokubedownscaler
  tag: "" # Defaults to appVersion
  digest: ""
  pullPolicy: IfNotPresent

## @param imagePullSecrets Secrets for pulling the controller image, e.g. `[{name: regcred}]`
imagePullSecrets: []

## @param arguments Additional command-line arguments, kept for compatibility with extraArguments
arguments:
#  - --interval=60

## @param extraArguments Additional command-line arguments, e.g. `["--interval=60s"]`
extraArguments:

## @param includedResources Kinds the downscaler manages. See the comments in values.yaml for every supported kind
includedResources:
  - deployments
#  - statefulsets
#  - daemonsets
#  - rollouts
#  - horizontalpodautoscalers
#  - jobs
#  - cronjobs
#  - scaledobjects
#  - services
#  - stacks
#  - poddisruptionbudgets
#  - prometheuses
#  - autoscalingrunnersets
#  - awselbservices
#  - awsnlbservices
#  - ingresses
#  - gateways
  # The entries below scale operator CUSTOM RESOURCES, not the ReplicaSets or
  # StatefulSets those operators own. The downscaler drives the CR (e.g. the
  # RabbitmqCluster / Elasticsearch / RedisReplication), and the operator
  # reconciles its own workloads from it. Do NOT also add the operators'
  # StatefulSets here — the generic statefulsets scaler is kept off operator-
  # owned StatefulSets via supportedOwnerKinds, and doubling up would fight the
  # operator. Enable a data engine by uncommenting only its CR entry.
#  - postgresqls
#  - cnpgclusters
#  - rabbitmqclusters
#  - elasticsearches
#  - mongodbcommunities
#  - redisreplications
#  - redissentinels
#  - kafkaconnects
#  - kafkamirrormaker2s
#  - kafkabridges
#  - advancedstatefulsets
#  - clonesets
#  - advancedcronjobs
#  - broadcastjobs
#  - imagepulljobs
#  - advanceddaemonsets

## @param constrainedNamespaces Restrict the downscaler to these namespaces, with namespaced Roles instead of a ClusterRole
constrainedNamespaces: []

## @param excludedNamespaces Namespaces the downscaler never touches. Empty means the release namespace and kube-system
excludedNamespaces:
  - kube-downscaler
  - kube-system

## @param configMap.name Name of the configuration ConfigMap. Defaults to the full name
## @param configMap.extraConfig Extra lines for the ConfigMap, e.g. `DOWNSCALE_PERIOD: "Mon-Sun 19:00-20:00 Europe/Berlin"`
configMap:
  name: ""
  extraConfig: ""

## @param forceRestartOnConfigChange Roll the pods when the ConfigMap changes
forceRestartOnConfigChange: true

## @param logging.json Write logs as JSON, one object per line, for Loki and other log pipelines
## @param logging.debug Log at debug level
logging:
  json: true
  debug: false

## @param extraEnv Extra environment variables for the controller container
extraEnv: []

## @section Service Account and RBAC

## @param serviceAccount.create Create a ServiceAccount for the controller
## @param serviceAccount.name ServiceAccount name. Defaults to the full name when created, otherwise `default`
## @param serviceAccount.annotations Annotations for the ServiceAccount, e.g. an IRSA role
## @param serviceAccount.automountServiceAccountToken Mount the API token on the ServiceAccount. The pod mounts it explicitly either way
serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: false

## @section Pod Scheduling and Security

## @param priorityClassName Priority class for the controller pods
priorityClassName: ""
## @param terminationGracePeriodSeconds Time the controller gets to finish its cycle and flush traces on shutdown
terminationGracePeriodSeconds: 30

## @param podAnnotations Annotations for the controller pods
podAnnotations: {}
## @param podLabels Labels for the controller pods
podLabels: {}

## @param podSecurityContext.runAsNonRoot Refuse to start as root
## @param podSecurityContext.runAsUser User ID the container runs as
## @param podSecurityContext.runAsGroup Group ID the container runs as
## @param podSecurityContext.fsGroup Group ID for mounted volumes
## @param podSecurityContext.supplementalGroups[0] Supplemental group ID
## @param podSecurityContext.seccompProfile.type Seccomp profile, required by the restricted Pod Security Standard
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  supplementalGroups: [1000]
  seccompProfile:
    type: RuntimeDefault

## @param securityContext.readOnlyRootFilesystem Mount the root filesystem read-only
## @param securityContext.allowPrivilegeEscalation Allow privilege escalation
## @param securityContext.privileged Run privileged
## @param securityContext.capabilities.drop Linux capabilities to drop
securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  privileged: false
  capabilities:
    drop:
      - ALL

## Starting points, not measurements: a scan every 30s over a few hundred
## workloads idles at a few millicores. Size from kubedownscaler_cycle_duration_seconds
## and container_memory_working_set_bytes once it runs. No CPU limit, so a
## cycle is never throttled; memory is limited so a leak is contained.
## @param resources.requests.cpu CPU request
## @param resources.requests.memory Memory request
## @param resources.limits.memory Memory limit
resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    memory: 128Mi

## @param nodeSelector Node labels for scheduling
nodeSelector: {}
## @param tolerations Tolerations for scheduling
tolerations: []
## @param affinity Affinity rules. When empty and replicaCount > 1, replicas prefer different nodes
affinity: {}
## @param topologySpreadConstraints Topology spread constraints for the controller pods
topologySpreadConstraints: []

## @param podDisruptionBudget.enabled Create a PodDisruptionBudget for the controller
## @param podDisruptionBudget.minAvailable Minimum available pods. Leave empty to use maxUnavailable
## @param podDisruptionBudget.maxUnavailable Maximum unavailable pods. 1 lets a single replica be drained
## @param podDisruptionBudget.unhealthyPodEvictionPolicy Evict pods that are not ready even when the budget is exhausted
podDisruptionBudget:
  enabled: true
  minAvailable: ""
  maxUnavailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow

## @section Port and Health Probes

## 8080 is unprivileged, so the non-root container binds it without
## CAP_NET_BIND_SERVICE; /healthz, /readyz and /metrics all share it.
## @param port Container port for /healthz, /readyz and /metrics
port: 8080

## Liveness fails when the scan loop has not completed a cycle within
## livenessStaleAfter. Readiness fails until the first cycle completes on the
## replica running the scan loop; standby replicas are ready. The startup probe
## waits on readiness, so it gives the first cycle up to
## startupProbe.failureThreshold x periodSeconds.
## @param healthProbes.livenessStaleAfter Time without a completed cycle before liveness fails. Empty means ten intervals, at least 5m
## @param healthProbes.readinessProbe.enabled Enable the readiness probe on /readyz
## @param healthProbes.readinessProbe.initialDelaySeconds Readiness probe initial delay
## @param healthProbes.readinessProbe.periodSeconds Readiness probe period
## @param healthProbes.readinessProbe.timeoutSeconds Readiness probe timeout
## @param healthProbes.readinessProbe.failureThreshold Readiness probe failure threshold
## @param healthProbes.readinessProbe.successThreshold Readiness probe success threshold
## @param healthProbes.livenessProbe.enabled Enable the liveness probe on /healthz
## @param healthProbes.livenessProbe.initialDelaySeconds Liveness probe initial delay
## @param healthProbes.livenessProbe.periodSeconds Liveness probe period
## @param healthProbes.livenessProbe.timeoutSeconds Liveness probe timeout
## @param healthProbes.livenessProbe.failureThreshold Liveness probe failure threshold
## @param healthProbes.livenessProbe.successThreshold Liveness probe success threshold
## @param healthProbes.startupProbe.enabled Enable the startup probe on /readyz
## @param healthProbes.startupProbe.initialDelaySeconds Startup probe initial delay
## @param healthProbes.startupProbe.periodSeconds Startup probe period
## @param healthProbes.startupProbe.timeoutSeconds Startup probe timeout
## @param healthProbes.startupProbe.failureThreshold Startup probe failure threshold
## @param healthProbes.startupProbe.successThreshold Startup probe success threshold
healthProbes:
  livenessStaleAfter: ""
  readinessProbe:
    enabled: true
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
    successThreshold: 1
  livenessProbe:
    enabled: true
    initialDelaySeconds: 0
    periodSeconds: 20
    timeoutSeconds: 2
    failureThreshold: 3
    successThreshold: 1
  startupProbe:
    enabled: true
    initialDelaySeconds: 0
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 60
    successThreshold: 1

## @section Network Policy

## @param networkPolicy.enabled Create a NetworkPolicy for the controller pods
## @param networkPolicy.apiServer.ports[0] API server port behind the kubernetes Service (managed control planes)
## @param networkPolicy.apiServer.ports[1] API server port on self-managed control planes
## @param networkPolicy.apiServer.cidrs CIDRs the API server is reached at. Narrow this to your control plane where you can
## @param networkPolicy.dns.namespaceSelector.kubernetes.io/metadata.name Namespace label of the cluster DNS
## @param networkPolicy.dns.podSelector.k8s-app Pod label of the cluster DNS
## @param networkPolicy.metricsFrom Peers allowed to reach the port. Empty allows any source, on that port only
## @param networkPolicy.extraEgress Extra egress rules, e.g. to a tracing collector outside tracing.collector
networkPolicy:
  enabled: true
  apiServer:
    ports: [443, 6443]
    cidrs:
      - 0.0.0.0/0
  dns:
    namespaceSelector:
      kubernetes.io/metadata.name: kube-system
    podSelector:
      k8s-app: kube-dns
  metricsFrom: []
  #  - namespaceSelector:
  #      matchLabels:
  #        kubernetes.io/metadata.name: monitoring
  extraEgress: []

## @section Metrics

## @param metrics.enabled Serve Prometheus metrics on /metrics
## @param metrics.service.enabled Create a Service in front of the metrics port, for the ServiceMonitor
## @param metrics.service.annotations Annotations for the metrics Service
metrics:
  enabled: true
  service:
    enabled: true
    annotations: {}

## @param serviceMonitor.enabled Create a Prometheus Operator ServiceMonitor. Needs metrics.service.enabled
## @param serviceMonitor.namespace Namespace for the ServiceMonitor. Defaults to the release namespace
## @param serviceMonitor.interval Scrape interval
## @param serviceMonitor.scrapeTimeout Scrape timeout
## @param serviceMonitor.additionalLabels Labels your Prometheus selects ServiceMonitors by, e.g. `release: kube-prometheus-stack`
## @param serviceMonitor.relabelings Relabelings applied before scraping
## @param serviceMonitor.metricRelabelings Relabelings applied to scraped samples
serviceMonitor:
  enabled: false
  namespace: ""
  interval: 1m
  scrapeTimeout: 10s
  additionalLabels: {}
  relabelings: []
  metricRelabelings: []

## @param podMonitor.enabled Create a Prometheus Operator PodMonitor instead of a ServiceMonitor
## @param podMonitor.namespace Namespace for the PodMonitor. Defaults to the release namespace
## @param podMonitor.interval Scrape interval
## @param podMonitor.scrapeTimeout Scrape timeout
## @param podMonitor.additionalLabels Labels your Prometheus selects PodMonitors by
## @param podMonitor.relabelings Relabelings applied before scraping
## @param podMonitor.metricRelabelings Relabelings applied to scraped samples
podMonitor:
  enabled: false
  namespace: ""
  interval: 1m
  scrapeTimeout: 10s
  additionalLabels: {}
  relabelings: []
  metricRelabelings: []

## @param prometheusRule.enabled Create a PrometheusRule with the downscaler alerts
## @param prometheusRule.namespace Namespace for the PrometheusRule. Defaults to the release namespace
## @param prometheusRule.additionalLabels Labels your Prometheus selects rules by
## @param prometheusRule.cycleStaleFor Alert when no cycle completed for this long
## @param prometheusRule.severity.critical Severity label for the down and stale alerts
## @param prometheusRule.severity.warning Severity label for the error and restart alerts
## @param prometheusRule.additionalRules Extra rules appended to the group
prometheusRule:
  enabled: false
  namespace: ""
  additionalLabels: {}
  cycleStaleFor: 10m
  severity:
    critical: critical
    warning: warning
  additionalRules: []

## @section Tracing

## Spans are exported over OTLP gRPC: one per cycle, one per workload, and one
## per Kubernetes API request. Settings become the standard OTEL_* variables.
## @param tracing.enabled Export OpenTelemetry traces
## @param tracing.endpoint OTLP gRPC endpoint, e.g. `http://alloy.monitoring.svc:4317`
## @param tracing.insecure Send spans without TLS
## @param tracing.serviceName service.name on the spans. Defaults to the full name
## @param tracing.sampler Sampler (OTEL_TRACES_SAMPLER)
## @param tracing.samplerArg Sampler argument (OTEL_TRACES_SAMPLER_ARG), the ratio for the ratio samplers
## @param tracing.resourceAttributes Extra resource attributes, e.g. `{deployment.environment: dev}`
## @param tracing.collector.namespaceSelector Namespace of the collector, opened in the NetworkPolicy
## @param tracing.collector.podSelector Pods of the collector, opened in the NetworkPolicy
## @param tracing.collector.port Collector port, opened in the NetworkPolicy
tracing:
  enabled: false
  endpoint: ""
  insecure: true
  serviceName: ""
  sampler: parentbased_traceidratio
  samplerArg: "1.0"
  resourceAttributes: {}
  collector:
    namespaceSelector: {}
    podSelector: {}
    port: 4317

## @section Extra Resources

## @param deployExtraResources.gatewayClass Create the downscaler GatewayClass (with gateways in includedResources)
## @param deployExtraResources.ingressClass Create the downscaler IngressClass (with ingresses in includedResources)
deployExtraResources:
  gatewayClass: false
  ingressClass: false

## @section Annotation Compliance

## @param annotationsCompliance.mutateUnauthorizedAnnotationsAddition Strip downscaler annotations added by unauthorised users (Kubernetes 1.34+)
## @param annotationsCompliance.failurePolicy Admission policy failure policy
## @param annotationsCompliance.validationActions Admission policy validation actions
## @param annotationsCompliance.authorizedNamespacesToServiceAccountsRegex Map of namespace to service-account regexes allowed to set annotations
## @param annotationsCompliance.authorizedUsersRegex Users allowed to set downscaler annotations
## @param annotationsCompliance.authorizedGroupsRegex Groups allowed to set downscaler annotations
## @param annotationsCompliance.onWorkloads.enabled Enforce on workloads
## @param annotationsCompliance.onWorkloads.preventRemoval Also block removal of the annotations on workloads
## @param annotationsCompliance.onNamespace.enabled Enforce on namespaces
## @param annotationsCompliance.onNamespace.preventRemoval Also block removal of the annotations on namespaces
annotationsCompliance:
  mutateUnauthorizedAnnotationsAddition: false
  failurePolicy: Ignore
  validationActions: [Deny]
  authorizedNamespacesToServiceAccountsRegex: {}
  authorizedUsersRegex: []
  authorizedGroupsRegex: []
  onWorkloads:
    enabled: false
    preventRemoval: false
  onNamespace:
    enabled: false
    preventRemoval: false

## @section Webhook Controller

## @param webhookController.enabled Deploy the admission webhook controller
## @param webhookController.image.repository Webhook image repository
## @param webhookController.image.pullPolicy Webhook image pull policy
## @param webhookController.image.tag Webhook image tag. Defaults to the chart appVersion
## @param webhookController.replicaCount Webhook replicas
## @param webhookController.priorityClassName Priority class for the webhook pods
## @param webhookController.serviceAccount.create Create a ServiceAccount for the webhook
## @param webhookController.serviceAccount.annotations Annotations for the webhook ServiceAccount
## @param webhookController.serviceAccount.name Webhook ServiceAccount name
## @param webhookController.extraArguments Additional webhook arguments
## @param webhookController.imagePullSecrets Secrets for pulling the webhook image
## @param webhookController.podAnnotations Annotations for the webhook pods
## @param webhookController.podLabels Labels for the webhook pods
## @param webhookController.extraEnv Extra environment variables for the webhook
## @param webhookController.securityContext.readOnlyRootFilesystem Mount the root filesystem read-only
## @param webhookController.securityContext.allowPrivilegeEscalation Allow privilege escalation
## @param webhookController.securityContext.privileged Run privileged
## @param webhookController.securityContext.capabilities.drop Linux capabilities to drop
## @param webhookController.healthProbes.readinessProbe.enabled Enable the readiness probe
## @param webhookController.healthProbes.readinessProbe.failureThreshold Readiness probe failure threshold
## @param webhookController.healthProbes.readinessProbe.initialDelaySeconds Readiness probe initial delay
## @param webhookController.healthProbes.readinessProbe.periodSeconds Readiness probe period
## @param webhookController.healthProbes.readinessProbe.timeoutSeconds Readiness probe timeout
## @param webhookController.healthProbes.readinessProbe.successThreshold Readiness probe success threshold
## @param webhookController.healthProbes.livenessProbe.enabled Enable the liveness probe
## @param webhookController.healthProbes.livenessProbe.failureThreshold Liveness probe failure threshold
## @param webhookController.healthProbes.livenessProbe.initialDelaySeconds Liveness probe initial delay
## @param webhookController.healthProbes.livenessProbe.periodSeconds Liveness probe period
## @param webhookController.healthProbes.livenessProbe.timeoutSeconds Liveness probe timeout
## @param webhookController.healthProbes.livenessProbe.successThreshold Liveness probe success threshold
## @param webhookController.healthProbes.startupProbe.enabled Enable the startup probe
## @param webhookController.healthProbes.startupProbe.failureThreshold Startup probe failure threshold
## @param webhookController.healthProbes.startupProbe.initialDelaySeconds Startup probe initial delay
## @param webhookController.healthProbes.startupProbe.periodSeconds Startup probe period
## @param webhookController.healthProbes.startupProbe.timeoutSeconds Startup probe timeout
## @param webhookController.healthProbes.startupProbe.successThreshold Startup probe success threshold
## @param webhookController.resources.limits.cpu Webhook CPU limit
## @param webhookController.resources.limits.memory Webhook memory limit
## @param webhookController.resources.requests.cpu Webhook CPU request
## @param webhookController.resources.requests.memory Webhook memory request
## @param webhookController.nodeSelector Node labels for scheduling the webhook
## @param webhookController.tolerations Tolerations for the webhook
## @param webhookController.affinity Affinity rules for the webhook
## @param webhookController.mutatingWebhookConfiguration.timeoutSeconds Webhook call timeout
## @param webhookController.mutatingWebhookConfiguration.failurePolicy Webhook failure policy
## @param webhookController.podDisruptionBudget.minAvailable Webhook PDB minimum available
## @param webhookController.podDisruptionBudget.maxUnavailable Webhook PDB maximum unavailable
## @param webhookController.clusterDomain Cluster DNS domain for the webhook certificate
## @param webhookController.certManager.enabled Issue the webhook certificate with cert-manager
## @param webhookController.certManager.duration Certificate lifetime
## @param webhookController.certManager.renewBefore Renew this long before expiry
## @param webhookController.certManager.secretTemplate Template for the certificate Secret
## @param webhookController.certManager.ca.generate Generate a CA. When false, the Secret needs the `cert-manager.io/allow-direct-injection: "true"` annotation
## @param webhookController.certManager.ca.secretName Secret holding the CA
## @param webhookController.certManager.issuer.generate Create the Issuer. When false, name an existing Issuer or ClusterIssuer below
## @param webhookController.certManager.issuer.name Existing issuer name
## @param webhookController.certManager.issuer.kind Existing issuer kind
## @param webhookController.certManager.issuer.group Existing issuer API group
## @param webhookController.podMonitor.enabled Create a PodMonitor for the webhook
## @param webhookController.podMonitor.interval Scrape interval
## @param webhookController.podMonitor.scrapeTimeout Scrape timeout
## @param webhookController.podMonitor.namespace Namespace for the PodMonitor. Defaults to the release namespace
## @param webhookController.podMonitor.additionalLabels Labels your Prometheus selects PodMonitors by
## @param webhookController.podMonitor.relabelings Relabelings applied before scraping
## @param webhookController.podMonitor.metricRelabelings Relabelings applied to scraped samples
webhookController:
  enabled: false

  image:
    repository: ghcr.io/caas-team/gokubedownscaler-webhook
    pullPolicy: IfNotPresent
    tag: "" # Dynamically set from CI

  replicaCount: 1

  priorityClassName: ""

  serviceAccount:
    create: true
    annotations: {}
    name: ""

  extraArguments: []

  imagePullSecrets: []

  podAnnotations: {}

  podLabels: {}

  extraEnv: []

  securityContext:
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    privileged: false
    capabilities:
      drop:
        - ALL

  healthProbes:
    readinessProbe:
      enabled: true
      failureThreshold: 3
      initialDelaySeconds: 5
      periodSeconds: 3
      timeoutSeconds: 2
      successThreshold: 1

    livenessProbe:
      enabled: true
      failureThreshold: 3
      initialDelaySeconds: 5
      periodSeconds: 3
      timeoutSeconds: 2
      successThreshold: 1

    startupProbe:
      enabled: true
      failureThreshold: 3
      initialDelaySeconds: 5
      periodSeconds: 3
      timeoutSeconds: 2
      successThreshold: 1

  resources:
    limits:
      cpu: 150m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi

  nodeSelector: {}

  tolerations: []

  affinity: {}

  mutatingWebhookConfiguration:
    timeoutSeconds: 10
    failurePolicy: Ignore

  podDisruptionBudget:
    minAvailable: ""
    maxUnavailable: ""

  clusterDomain: cluster.local

  certManager:
    enabled: false
    duration: 8760h0m0s # 1 year
    renewBefore: 5840h0m0s # 8 months
    secretTemplate: {}
    ca:
      generate: true
      secretName: "kubedownscaler-ca"
    issuer:
      generate: true
      name: foo-org-ca
      kind: ClusterIssuer
      group: cert-manager.io

  podMonitor:
    enabled: false
    interval: "1m"
    scrapeTimeout: "10s"
    namespace: ""
    additionalLabels: {}
    relabelings: []
    metricRelabelings: []

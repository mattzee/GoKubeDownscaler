{{- if and .Values.metrics.enabled .Values.prometheusRule.enabled }}
{{- $selector := printf "namespace=%q, container=%q" .Release.Namespace .Chart.Name }}
{{- $critical := .Values.prometheusRule.severity.critical }}
{{- $warning := .Values.prometheusRule.severity.warning }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "go-kube-downscaler.fullname" . }}
  namespace: {{ .Values.prometheusRule.namespace | default .Release.Namespace }}
  labels:
    {{- include "go-kube-downscaler.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics
    {{- with .Values.prometheusRule.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: {{ include "go-kube-downscaler.fullname" . }}
      rules:
        - alert: KubeDownscalerDown
          expr: absent(up{ {{- $selector -}} } == 1)
          for: 10m
          labels:
            severity: {{ $critical }}
          annotations:
            summary: The downscaler in {{ .Release.Namespace }} is not being scraped.
            description: No healthy downscaler target for 10 minutes, so no environment is being scaled on schedule.
        - alert: KubeDownscalerCycleStale
          expr: sum(increase(kubedownscaler_cycle_executions_total{ {{- $selector -}} }[{{ .Values.prometheusRule.cycleStaleFor }}])) == 0
          for: 5m
          labels:
            severity: {{ $critical }}
          annotations:
            summary: The downscaler in {{ .Release.Namespace }} has not completed a scan cycle in {{ .Values.prometheusRule.cycleStaleFor }}.
            description: The scan loop is running but not finishing cycles. Check the controller logs and kubedownscaler_cycle_duration_seconds.
        - alert: KubeDownscalerNoSingleLeader
          expr: sum(kubedownscaler_scanning{ {{- $selector -}} }) != 1
          for: 5m
          labels:
            severity: {{ $critical }}
          annotations:
            summary: "{{`{{ $value }}`}} downscaler replicas in {{ .Release.Namespace }} are running the scan loop."
            description: Exactly one replica should hold the lease and scan. None means nothing is scaled; more than one means replicas fight over workloads.
        - alert: KubeDownscalerWorkloadScanErrors
          expr: sum by (kind) (increase(kubedownscaler_workload_scan_errors_total{ {{- $selector -}} }[15m])) > 0
          for: 15m
          labels:
            severity: {{ $warning }}
          annotations:
            summary: "Downscaler scans of {{`{{ $labels.kind }}`}} workloads keep failing."
            description: "{{`{{ $value | humanize }}`}} failed {{`{{ $labels.kind }}`}} scans in the last 15 minutes. The logs name the workloads."
        - alert: KubeDownscalerScalingErrors
          expr: sum by (exported_namespace, type) (kubedownscaler_scaling_errors{ {{- $selector -}} }) > 0
          for: 30m
          labels:
            severity: {{ $warning }}
          annotations:
            summary: "Downscaler {{`{{ $labels.type }}`}} errors in namespace {{`{{ $labels.exported_namespace }}`}}."
            description: The downscaler could not apply its decision to some workloads in that namespace, often because of a malformed annotation.
        - alert: KubeDownscalerRestarting
          expr: increase(kube_pod_container_status_restarts_total{ {{- $selector -}} }[30m]) > 2
          for: 5m
          labels:
            severity: {{ $warning }}
          annotations:
            summary: "Downscaler pod {{`{{ $labels.pod }}`}} restarted {{`{{ $value | humanize }}`}} times in 30 minutes."
            description: Repeated restarts usually mean the liveness probe found the scan loop stuck, or the container ran out of memory.
        {{- with .Values.prometheusRule.additionalRules }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "go-kube-downscaler.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "go-kube-downscaler.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  {{- with .Values.updateStrategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "go-kube-downscaler.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "go-kube-downscaler.selectorLabels" . | nindent 8 }}
        {{- include "go-kube-downscaler.standardLabels" . | nindent 8 }}
        app.kubernetes.io/component: controller
        {{- with .Values.commonLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if or .Values.podAnnotations .Values.forceRestartOnConfigChange }}
      annotations:
        {{- if .Values.forceRestartOnConfigChange }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "go-kube-downscaler.serviceAccountName" . }}
      automountServiceAccountToken: true
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "go-kube-downscaler.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --include-resources={{ join "," .Values.includedResources }}
            - --port={{ .Values.port }}
            {{- with .Values.healthProbes.livenessStaleAfter }}
            - --health-stale-after={{ . }}
            {{- end }}
            {{- if .Values.logging.json }}
            - --json-logs
            {{- end }}
            {{- if .Values.logging.debug }}
            - --debug
            {{- end }}
            {{- if .Values.metrics.enabled }}
            - --metrics
            {{- end }}
            {{- if .Values.tracing.enabled }}
            - --tracing
            {{- end }}
            {{- if eq (include "go-kube-downscaler.leaderElection" .) "true" }}
            - --leader-election
            {{- end }}
            {{- if .Values.constrainedNamespaces }}
            - --namespace={{ join "," .Values.constrainedNamespaces }}
            {{- end }}
            {{- with .Values.extraArguments }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with .Values.arguments }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "go-kube-downscaler.configMapName" . }}
                optional: true
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- if .Values.tracing.enabled }}
            {{- if .Values.tracing.endpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.tracing.endpoint | quote }}
            {{- end }}
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: {{ .Values.tracing.insecure | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.tracing.serviceName | default (include "go-kube-downscaler.fullname" .) | quote }}
            - name: OTEL_TRACES_SAMPLER
              value: {{ .Values.tracing.sampler | quote }}
            - name: OTEL_TRACES_SAMPLER_ARG
              value: {{ .Values.tracing.samplerArg | quote }}
            - name: OTEL_RESOURCE_ATTRIBUTES
              {{- $attributes := list "k8s.pod.name=$(POD_NAME)" "k8s.namespace.name=$(POD_NAMESPACE)" (printf "service.version=%s" (.Values.image.tag | default .Chart.AppVersion)) }}
              {{- range $key, $value := .Values.tracing.resourceAttributes }}
              {{- $attributes = append $attributes (printf "%s=%s" $key $value) }}
              {{- end }}
              value: {{ join "," $attributes | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- with .Values.healthProbes }}
          {{- if .startupProbe.enabled }}
          startupProbe:
            {{- include "go-kube-downscaler.probe" (dict "path" "/readyz" "probe" .startupProbe) | nindent 12 }}
          {{- end }}
          {{- if .livenessProbe.enabled }}
          livenessProbe:
            {{- include "go-kube-downscaler.probe" (dict "path" "/healthz" "probe" .livenessProbe) | nindent 12 }}
          {{- end }}
          {{- if .readinessProbe.enabled }}
          readinessProbe:
            {{- include "go-kube-downscaler.probe" (dict "path" "/readyz" "probe" .readinessProbe) | nindent 12 }}
          {{- end }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      {{- else if gt (int .Values.replicaCount) 1 }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "go-kube-downscaler.selectorLabels" . | nindent 20 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
